<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Hyperse Track">
  <title>Hyperse Track</title>
  <defs>
    <linearGradient id="brand" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.42" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="16" y1="2" x2="16" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.4"/>
