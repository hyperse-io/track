name: ReleaseOrVersionPR

on:
  push:
    branches:
      - main

jobs:
  release:
    # Basic security: the release job can only be executed from this repo and from the main branch (not a remote thing)
    if: ${{ github.repository == 'hyperse-io/track' && contains('refs/heads/main',github.ref) && !startsWith(github.head_ref, 'changeset-release/') }}
    name: Release and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          # To run comparison we need more than the latest commit.
          # @link https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: 📥 Monorepo install
        uses: ./.github/actions/yarn-nm-install

      # @link https://github.com/changesets/action (v2 for @changesets/cli v3)
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: yarn release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: '[Release] Version packages'
          commit-message: 'Version Packages [skip ci]'
          # Optional, might be used in conjunction with GITHUB_TOKEN to
          # allow running the workflows on a Version package action.
          # Be aware of security implications.
          # setupGitUser: true
        env:
          # See https://github.com/changesets/action/issues/147
          HOME: ${{ github.workspace }}
          # Skip husky during `npm publish` prepare (no .git in pack context)
          HUSKY: '0'
          # Allows to download / query / comment packages
          # Allows to publish packages
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
