name: CI-track

on:
  push:
    branches:
      - main
      - major
      - minor
      - dev
    paths:
      - 'packages/track/**'
      - 'examples/**'
      - 'package.json'
      - 'packages/*/package.json'
      - '*.lock'
      - '.yarnrc.yml'
      - '.prettier*'
      - '.github/**'

  pull_request:
    branches:
      - main
      - major
      - minor
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'packages/track/**'
      - 'examples/**'
      - 'package.json'
      - 'packages/*/package.json'
      - '*.lock'
      - '.yarnrc.yml'
      - '.prettier*'
      - '.github/**'

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: 📥 Monorepo install
        uses: ./.github/actions/yarn-nm-install

      - name: Typecheck
        run: |
          yarn typecheck

      - name: Linter
        run: |
          yarn lint

      - name: Unit tests
        run: |
          yarn test
